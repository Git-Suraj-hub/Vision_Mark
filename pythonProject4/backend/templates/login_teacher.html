<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal Sign In — Vision Mark</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      
      <div class="login-header">
        <img src="/static/images/logo.png" alt="Vision Mark Logo" class="login-logo">
        <h1>Faculty Portal</h1>
        <p class="subtitle">Enter your faculty credentials to manage course attendance</p>
      </div>
      
      <form id="loginForm" class="login-form">
        <input type="hidden" name="role" value="teacher">
        
        <div class="form-group">
          <label for="username">Faculty Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. chandra_shekhar" required autofocus autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">
          <span>Sign In to Faculty Center</span>
        </button>
        
        <div id="msg" class="message" role="alert"></div>
      </form>
      
      <div class="login-footer">
        <a href="/" class="back-link">
          <span aria-hidden="true">&larr;</span> Back to home
        </a>
      </div>
    </div>
  </div>

  <script>
  document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const msg = document.getElementById("msg");
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';
      msg.textContent = "";
      msg.className = "message";
      
      const formData = new FormData(e.target);
      
      try {
          const res = await fetch("/api/login", {
              method: "POST",
              body: formData
          });
          const data = await res.json();
          
          if (data.success) {
              msg.className = "message success";
              msg.textContent = "Authentication successful. Redirecting...";
              setTimeout(() => {
                  window.location.href = "/teacher/dashboard";
              }, 600);
          } else {
              msg.className = "message error";
              msg.textContent = data.msg || "Invalid faculty credentials.";
              submitBtn.disabled = false;
              submitBtn.innerHTML = 'Sign In to Faculty Center';
          }
      } catch (error) {
          msg.className = "message error";
          msg.textContent = "Unable to connect to verification server. Please try again.";
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In to Faculty Center';
      }
  };
  </script>
</body>
</html>
